# mise: https://mise.jdx.dev/
#
# One-stop toolchain + task runner for this polyglot monorepo.
# `mise install` installs everything under [tools]; `mise run <task>`
# dispatches to the native toolchain per language.
#
# Native per-language pin files are kept alongside this one (.nvmrc,
# package.json's `packageManager`, go.work / go.mod's `go` directive,
# pyproject.toml's `requires-python`) so contributors without mise can
# still use the native tools directly. If both are present, they must
# agree. There is no `rust-toolchain.toml`: rust is pinned here only.

[settings]
minimum_release_age = "7d"
lockfile = true

# What `lockfile = true` actually buys, and where it stops. mise.lock
# records a checksum per tool *per platform*. Coverage is better than the
# "only the platform you installed on" you might expect: the `aqua:` and
# `core:` backends read the upstream release manifest, so one `mise
# install` on macos-arm64 records all 11 platforms — a contributor on
# linux-x64 is covered by a hash nobody here has ever installed against.
#
# Two entries have no checksum on any platform. Neither is fixed here;
# both are documented so the "pin everything" rule below is not read as
# a stronger guarantee than it delivers:
#
#   - `rust`. The `core:rust` backend shells out to rustup, which does
#     its own verification against the channel manifest. A real control,
#     but a different one, and mise.lock does not record its result.
#   - `go:.../govulncheck`. Compiled from source, so there is no release
#     binary to hash; the Go checksum database and sum.golang.org
#     authenticate the module download instead. Same shape of answer.
#
# So: verified by mise for 14 of 16 tools, verified by rustup and by the
# Go checksum database for the other two. Nothing here is unverified —
# but only the first group is recorded in a file you can review.

# Every tool is pinned to an exact version, deliberately and without
# exception — including python, go and rust. This is a supply-chain rule,
# not a stability one: an upstream compromise must never be
# auto-downloaded. A blanket "pin everything, update mechanically" policy
# is far easier to review than a per-dependency judgement about which
# upstreams are trustworthy enough to float.
#
# Pinning the rust *toolchain* here is not an MSRV declaration; there is
# still deliberately no `rust-version` in Cargo.toml.
#
# The cost is that nothing here is covered by dependabot, so these go
# stale silently. Refresh them deliberately with `mise up`, and read the
# diff. Keep the native pin files in step when you do: `.nvmrc` (node),
# `package.json` `packageManager` (pnpm), `go.work` (go),
# `pyproject.toml` `requires-python` (python). They are exact too, so
# "they must agree" is literally checkable.
#
# The 7-day cooldown this repo applies to *dependencies*
# (`dependabot.yml` cooldown, `pnpm-workspace.yaml` minimumReleaseAge,
# `pyproject.toml` exclude-newer) is deliberately NOT applied here.
# Tool versions are chosen by a human reading a changelog, not resolved
# automatically, so the risk the cooldown mitigates — picking up a
# freshly-published bad release without anyone looking — does not apply
# in the same way. mise's own `minimum_release_age` may still hide a
# version from `mise ls-remote`; that is a local mise setting, not this
# repo's policy.
[tools]
node = "26.7.0"
pnpm = "11.20.0"
python = "3.14.7"
rust = "1.97.1"
go = "1.26.5"
uv = "0.12.3"
golangci-lint = "2.12.2"
gofumpt = "0.11.0"
# Docs site (packages/lsimons-template-doc): Astro Starlight builds with bun,
# Quarto renders the slide decks.
bun = "1.3.14"
"aqua:quarto-dev/quarto-cli" = "1.10.18"
# Used by `mise run audit`; must match `version:` on the workflow's
# zizmor step. Bump them together.
zizmor = "1.29.0"
# Used by `mise run gha:lint`. actionlint shells out to shellcheck for
# the `run:` blocks in workflows, and silently skips that half if
# shellcheck is missing, so it is pinned here too rather than left to
# whatever the host happens to have.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Used by `mise run vuln:osv`. One scanner for all five ecosystems: it
# reads uv.lock, pnpm-lock.yaml, bun.lock, Cargo.lock and go.mod, so this
# repo does not need `pip-audit` + `pnpm audit` + `bun audit` +
# `cargo audit` as four separately-pinned tools with four output formats.
# Unlike zizmor there is no second version to keep in step: the CI job
# runs the mise task through mise-action, so this pin is the only one.
osv-scanner = "2.5.0"
# Used by `mise run rs:deny`. osv-scanner already covers Cargo.lock
# advisories, so this is here for the two checks it does *not* do:
# `sources` (every crate must come from crates.io — a git or path
# dependency has no registry provenance) and yanked-crate detection.
# See deny.toml for why `licenses` and `bans` are deliberately off.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# Used by `mise run go:vulncheck`. Also not redundant with osv-scanner:
# osv reads go.mod, so it sees module dependencies but never the Go
# *toolchain*, and a Go stdlib CVE is invisible to it. govulncheck also
# does reachability analysis, so it reports the subset actually called.
#
# Not in mise's registry, so it comes from the Go module proxy via the
# `go:` backend, exact-pinned like the rest. It is compiled at install
# time, which is the one entry here that costs more than a download.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

# Project-scoped env: load an optional .env if present (fnox-generated
# or hand-written). Keep secrets out of git; use fnox for op:// refs.
[env]
_.file = { path = ".env", optional = true }

# ---------- Top-level fan-outs ----------
[tasks.init]
description = "Rename this template to a new project (see scripts/init.py)"
run = "python3 scripts/init.py"

[tasks.install]
description = "Install all language dependencies"
depends = ["py:install", "ts:install", "doc:install"]

# The frozen counterpart, for the gate. `install` stays unfrozen because
# that is the task you run while deliberately changing dependencies and
# it is allowed to rewrite the lock; this one is what CI calls, so a
# manifest edit that the committed lock does not reflect is an error
# instead of a silent re-resolve on the runner. A lockfile CI is willing
# to regenerate is not a pin, which would undercut every other pinning
# rule in this file.
[tasks."install-frozen"]
description = "Install all language dependencies, failing on a stale lock"
depends = ["py:install-frozen", "ts:install-frozen", "doc:install-frozen"]

[tasks.lint]
description = "Run all linters"
depends = ["py:lint", "ts:lint", "go:lint", "rs:lint", "gha:lint"]

[tasks.format]
description = "Auto-format all languages"
depends = ["py:format", "ts:format", "go:format", "rs:format"]

[tasks.typecheck]
description = "Run type checkers (py + ts + doc)"
depends = ["py:typecheck", "ts:typecheck", "doc:check"]

[tasks.test]
description = "Run all tests"
depends = ["py:test", "ts:test", "go:test", "rs:test"]

[tasks.build]
description = "Build all buildable targets"
depends = ["ts:build", "go:build", "rs:build", "rs:doc", "doc:build"]

[tasks.ci]
description = "Full CI gate: lint + typecheck + test + build"
depends = ["lint", "typecheck", "test", "build"]

[tasks.clean]
description = "Remove all build output and installed deps"
run = """
rm -rf node_modules packages/*/node_modules
rm -rf .venv packages/*/.venv
rm -rf target
rm -rf packages/lsimons-template-doc/.astro
find packages -name 'bin' -maxdepth 2 -type d -exec rm -rf {} +
find packages -name 'dist' -maxdepth 2 -type d -exec rm -rf {} +
find packages -name '*.tsbuildinfo' -delete
find . -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
"""

# ---------- Python ----------
[tasks."py:install"]
description = "uv sync; may update uv.lock"
run = "uv sync --all-groups --all-packages"

[tasks."py:install-frozen"]
description = "uv sync, failing on a stale uv.lock"
run = "uv sync --all-groups --all-packages --locked"

[tasks."py:lint"]
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."py:format"]
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks."py:typecheck"]
run = "uv run basedpyright"

[tasks."py:test"]
run = "uv run pytest"

# ---------- TypeScript ----------
[tasks."ts:install"]
description = "pnpm install; may update pnpm-lock.yaml"
run = "pnpm install"

[tasks."ts:install-frozen"]
description = "pnpm install, failing on a stale pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks."ts:lint"]
# biome check runs from the workspace root (root package.json "lint" script)
run = "pnpm lint"

[tasks."ts:format"]
# biome format runs from the workspace root
run = "pnpm format"

[tasks."ts:typecheck"]
run = "pnpm -r --parallel typecheck"

[tasks."ts:test"]
run = "pnpm -r --parallel test"

[tasks."ts:build"]
run = "pnpm -r --parallel build"

# ---------- Go ----------
# go.work coordinates the modules, but most `go` subcommands still want
# to be run from inside a module directory; iterate over packages/*-go
# so adding a new Go module is just "drop it in + add a `use` line".
[tasks."go:lint"]
run = """
set -e
for m in packages/*-go; do
  [ -d "$m" ] || continue
  echo "--- golangci-lint $m"
  (cd "$m" && golangci-lint run ./...)
  out=$(cd "$m" && gofmt -l .)
  if [ -n "$out" ]; then
    echo "Unformatted Go files in $m:"
    echo "$out"
    exit 1
  fi
done
"""

[tasks."go:format"]
run = """
set -e
for m in packages/*-go; do
  [ -d "$m" ] || continue
  (cd "$m" && gofumpt -w .)
done
"""

[tasks."go:test"]
run = """
set -e
for m in packages/*-go; do
  [ -d "$m" ] || continue
  echo "--- go test $m"
  (cd "$m" && go test -race -cover ./...)
done
"""

# Run by `mise run vuln`, not by `go:lint` — it needs network access.
# Complements the osv-scanner pass rather than duplicating it: osv reads
# go.mod, so it never sees the Go *toolchain*, and a stdlib CVE is
# invisible to it. govulncheck checks both, and does reachability
# analysis, so it reports only the vulnerabilities actually called.
[tasks."go:vulncheck"]
description = "govulncheck over every Go module (stdlib + deps, reachability-aware)"
run = """
set -e
for m in packages/*-go; do
  [ -d "$m" ] || continue
  echo "--- govulncheck $m"
  (cd "$m" && govulncheck ./...)
done
"""

[tasks."go:build"]
run = """
set -e
for m in packages/*-go; do
  [ -d "$m" ] || continue
  echo "--- go build $m"
  (cd "$m" && go build ./...)
done
"""

# ---------- Rust ----------
# `RUSTFLAGS = "-D warnings"` is repeated on every task that invokes
# rustc, not set once in the workflow. `clippy -- -D warnings` only denies
# *clippy* lints; the workspace also declares rustc lints
# (`missing_debug_implementations = "warn"` in Cargo.toml), and those are
# only denied by RUSTFLAGS. Setting it in CI alone let `mise run ci` pass
# while CI failed. Keep the value identical across all four tasks —
# a differing RUSTFLAGS invalidates cargo's fingerprint and forces a
# full rebuild between them.
# `--locked` on every cargo command that resolves, matching the
# `*:install-frozen` tasks for the other three package managers: without
# it a Cargo.toml edit silently rewrites Cargo.lock, on the runner as
# much as locally, and the committed lock stops being a pin. Cargo has no
# separate install step to hang this off, so it goes on each task.
# `cargo fmt` neither resolves nor accepts the flag.
[tasks."rs:lint"]
env = { RUSTFLAGS = "-D warnings" }
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks."rs:format"]
run = "cargo fmt --all"

[tasks."rs:test"]
env = { RUSTFLAGS = "-D warnings" }
run = "cargo test --workspace --all-targets --locked"

[tasks."rs:build"]
env = { RUSTFLAGS = "-D warnings" }
run = "cargo build --workspace --all-targets --locked"

# CI ran this as a bare `cargo doc` step, so `mise run ci` was a weaker
# gate than the workflow. Same command, reachable both ways.
# Run by `mise run vuln`, not by `rs:lint` — it needs network access to
# fetch the RustSec advisory database. Only `advisories` and `sources`
# are configured in deny.toml, and only those two are run; a bare
# `cargo deny check` would also run `licenses`, which has no allowlist
# here and fails immediately. See deny.toml for why.
#
# The advisories half overlaps osv-scanner's Cargo.lock pass. It is kept
# anyway for the `sources` policy — every crate must come from crates.io,
# which is what stops a git or path dependency with no registry
# provenance from entering the graph — and for yanked-crate detection,
# which OSV does not model.
[tasks."rs:deny"]
description = "cargo-deny: RustSec advisories + crates.io-only source policy"
run = "cargo-deny --all-features check advisories sources"

[tasks."rs:doc"]
description = "cargo doc with warnings denied"
env = { RUSTFLAGS = "-D warnings", RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --all-features --locked"

# ---------- GitHub Actions ----------
# actionlint needs shellcheck on PATH to check workflow `run:` blocks; it
# skips them silently (still exiting 0) when shellcheck is missing, which
# is why both are pinned in [tools] rather than left to the host.
[tasks."gha:lint"]
description = "actionlint (+ shellcheck) over .github/workflows"
run = "actionlint"

# Local mirror of the `zizmor` CI step, using the mise-pinned zizmor. Not
# part of `ci` because it needs network access and a GitHub token for the
# online audits.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on
# a weaker check than the name promises.
#
# Scoped to `.github` rather than `.` on purpose: `--collect=all` walks
# the whole tree, and the docs site's `node_modules` ships third-party
# workflows that are not ours to fix. Nothing is lost — there is no
# `action.yml` anywhere outside `.github`, and workflows, actions and
# dependabot config are the only things zizmor audits. `inputs:` on the
# CI zizmor step is set to the same path so the two stay identical.
#
# One deliberate asymmetry: `--strict-collection` has no `zizmor-action`
# input, so it is local-only. That makes this task *stricter* than CI,
# which fails safe. Do not delete the flag to "fix the drift".
#
# The token is resolved here and passed explicitly, and both env vars are
# unset before zizmor runs. zizmor accepts a token from either
# `GITHUB_TOKEN` (`--github-token`) or `GH_TOKEN` (`--gh-token`), and
# rejects an *empty* one with a raw argument-parsing error (exit 2)
# rather than treating it as absent — so a blank `GITHUB_TOKEN=` line in
# the optional `.env` this file loads used to sail straight past the
# check below. An already-exported non-empty token is used as-is, so this
# also works where `gh` is not installed at all.
[tasks.audit]
description = "zizmor audit of GitHub Actions workflows + dependabot config"
run = """
set -e
token="${GH_TOKEN:-}"
if [ -z "$token" ]; then token="${GITHUB_TOKEN:-}"; fi
if [ -z "$token" ]; then token=$(gh auth token 2>/dev/null) || true; fi
if [ -z "$token" ]; then
  echo "No GitHub token: run \\`gh auth login\\`, or export GH_TOKEN." >&2
  echo "Refusing to run a partial audit — the online audits" >&2
  echo "(impostor-commit, known-vulnerable-actions) would be skipped." >&2
  exit 1
fi
unset GH_TOKEN GITHUB_TOKEN
zizmor --github-token "$token" --collect=all --strict-collection .github
"""

# ---------- Dependency vulnerability scanning ----------
# Umbrella for the three scanners. Deliberately NOT part of `ci`, for the
# same reason `audit` is not: every one of these queries a remote
# vulnerability database, and `ci` is meant to stay runnable offline. CI
# enforces this in its own `vuln` job instead, which also means a newly
# published advisory against an unchanged tree can turn that job red
# without implying the code broke.
#
# Unlike `audit` none of these needs a token, and all three fail loudly
# when the database is unreachable — so there is no silent-downgrade case
# to guard against here.
[tasks.vuln]
description = "Scan every lockfile for known vulnerabilities (network; not part of `ci`)"
depends = ["vuln:osv", "rs:deny", "go:vulncheck"]

# osv-scanner reads all five of this repo's lockfiles — uv.lock,
# pnpm-lock.yaml, bun.lock, Cargo.lock, go.mod — against the OSV
# database, which aggregates GHSA, RustSec, PyPA and the Go vuln DB. One
# tool instead of `pip-audit` + `pnpm audit` + `bun audit` + a cargo
# advisory scanner.
#
# `-r` is load-bearing and easy to lose: `osv-scanner scan source` is NOT
# recursive by default. Without it the walk stops at the top level, finds
# only the three root-level locks, and reports "No issues found" having
# never opened bun.lock or go.mod — a pass that silently covers 60% of
# the tree. `.gitignore` is still honoured, so node_modules, .venv and
# target stay out.
#
# Because that failure is silent, the scan is not trusted on its own: the
# loop below re-derives the lockfile list from git and fails if the
# scanner did not report opening every one. That also enforces the
# AGENTS.md rule that a new package manager means a new lockfile — add
# one without teaching osv-scanner about it and this goes red rather than
# quietly scanning four fifths of the dependencies.
[tasks."vuln:osv"]
description = "osv-scanner over every committed lockfile"
run = '''
set -eu
status=0
out=$(osv-scanner scan source -r . 2>&1) || status=$?
echo "$out"

missing=0
for lock in $(git ls-files -- '*uv.lock' '*pnpm-lock.yaml' '*Cargo.lock' '*bun.lock' '*go.mod'); do
  case "$out" in
    *"/$lock file and found"*) ;;
    *)
      echo "osv-scanner never opened $lock — its dependencies went unscanned." >&2
      missing=1
      ;;
  esac
done
if [ "$missing" -ne 0 ]; then
  echo "Every committed lockfile must be scanned. Check that osv-scanner" >&2
  echo "supports its format, and that the -r flag is still present." >&2
  exit 1
fi
exit "$status"
'''

# ---------- Docs (Astro Starlight + Quarto) ----------
# The docs site is a bun project under packages/lsimons-template-doc; it is
# intentionally NOT a pnpm workspace member (pnpm globs `packages/*-ts`).
[tasks."doc:install"]
description = "Install the docs site dependencies (bun); may update bun.lock"
dir = "packages/lsimons-template-doc"
run = "bun install"

[tasks."doc:install-frozen"]
description = "Install the docs site dependencies, failing on a stale bun.lock"
dir = "packages/lsimons-template-doc"
run = "bun install --frozen-lockfile"

[tasks."doc:dev"]
description = "Start the live-reloading docs dev server"
dir = "packages/lsimons-template-doc"
run = "bun run dev"

[tasks."doc:build"]
description = "Build the static docs site into packages/lsimons-template-doc/dist"
dir = "packages/lsimons-template-doc"
run = "bun run build"

[tasks."doc:preview"]
description = "Preview the production docs build"
dir = "packages/lsimons-template-doc"
run = "bun run preview"

[tasks."doc:check"]
description = "Astro type/content check for the docs site"
dir = "packages/lsimons-template-doc"
run = "bunx astro check"

[tasks."doc:slides"]
description = "Render the example Quarto slide deck to HTML + PDF"
run = "quarto render {{arg(name='deck', default='packages/lsimons-template-doc/public/presentations/example.qmd')}}"

[tasks."doc:favicon"]
description = "Regenerate the docs favicon + apple-touch-icon from the palette"
dir = "packages/lsimons-template-doc"
run = "bun run scripts/gen-favicon.mjs"

[tasks."doc:clean"]
description = "Remove docs build artifacts"
run = "rm -rf packages/lsimons-template-doc/dist packages/lsimons-template-doc/.astro"

[tasks."doc:browser"]
description = "Install the Chromium browser Playwright uses for screenshots"
dir = "packages/lsimons-template-doc"
run = "bunx playwright install chromium"

[tasks."doc:screenshot"]
description = "Build, serve, and screenshot a page (args: [out] [path]). Needs `mise run doc:browser` once."
dir = "packages/lsimons-template-doc"
run = """
out="{{arg(name='out', default='out.png')}}"
path="{{arg(name='path', default='/lsimons-template-mono/')}}"
bun run build
bun run preview --port 4321 > /tmp/astro-preview.log 2>&1 &
sleep 4
bunx playwright screenshot --viewport-size=1280,800 "http://localhost:4321${path}" "$out"
status=$?; pkill -f "astro preview" || true; exit $status
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
