name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main, so
# the main-branch CI history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install
        run: mise run py:install

      - name: Lint
        run: mise run py:lint

      - name: Typecheck
        run: mise run py:typecheck

      - name: Test
        run: mise run py:test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: mise run ts:install

      - name: Lint (Biome)
        run: mise run ts:lint

      - name: Typecheck
        run: mise run ts:typecheck

      - name: Test
        run: mise run ts:test

      - name: Build
        run: mise run ts:build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Lint + format check
        run: mise run go:lint

      - name: Test
        run: mise run go:test

      - name: Build
        run: mise run go:build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      # RUSTFLAGS deliberately does NOT live here. It used to, which made
      # this job deny rustc lints (Cargo.toml's
      # `missing_debug_implementations = "warn"`) that `mise run ci` did
      # not, so a local green run could still go red here. It is now set
      # on the `rs:*` tasks themselves. Only genuinely CI-specific
      # settings belong in this block.
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint (fmt + clippy)
        run: mise run rs:lint

      - name: Build
        run: mise run rs:build

      - name: Test
        run: mise run rs:test

      - name: Doc build
        run: mise run rs:doc

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('packages/lsimons-template-doc/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: mise run doc:install

      - name: Check (Astro type/content check)
        run: mise run doc:check

      - name: Build
        run: mise run doc:build

  actions:
    name: GitHub Actions (lint + audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the two tools this job needs; installing the whole polyglot
      # toolchain here would cost minutes for a workflow linter.
      #
      # Caveat worth knowing before copying this to the other jobs: mise
      # can auto-install a missing tool when `mise run` reaches for it, so
      # an `install_args` list that is too narrow shows up as a slower job,
      # not a failing one. Check the timings, not just the colour.
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          install_args: actionlint shellcheck
          cache: true

      - name: Lint workflows (actionlint + shellcheck)
        run: mise run gha:lint

      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action's own defaults are version "latest", collect
          # "default" and inputs ".". Pin the version so a zizmor release
          # cannot turn CI red on its own, and set collect: all so
          # .github/dependabot.yml is audited too. Scope inputs to
          # .github because --collect=all otherwise walks node_modules
          # once the docs site is installed. All three must match
          # `mise run audit` for that task to be a real local mirror —
          # bump the version in both places together.
          version: "1.29.0"
          collect: all
          inputs: .github
