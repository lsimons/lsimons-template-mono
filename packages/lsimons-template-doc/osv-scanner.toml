# osv-scanner config for this package's bun.lock. osv-scanner picks up the
# osv-scanner.toml in the same directory as the lockfile it is scanning,
# so `mise run vuln:osv` (and the CI `vuln` job) applies it with no flag.
#
# Every entry must carry an `ignoreUntil` so it expires and turns the scan
# red again, forcing a fresh look rather than a permanent silent waiver.

# postcss-selector-parser: quadratic-complexity DoS in selector parsing.
# Fixed only in 7.1.6, but the sole consumer here is postcss-nested 6.x
# (via @expressive-code/core, via @astrojs/starlight), which requires
# ^6.1.1. A bun override onto 7.x would cross a major under a consumer that
# has not opted in, so it is ignored instead. Exposure is build-time only:
# the docs site is static, and the parser only sees CSS from expressive-code
# themes and this repo, never user input.
# Revisit when @expressive-code/core moves to postcss-nested 8.x
# (which takes postcss-selector-parser ^7.1.4).
[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
ignoreUntil = 2026-11-11T00:00:00Z
reason = "Fix is postcss-selector-parser 7.x; postcss-nested 6.x (expressive-code) requires ^6. Build-time only, never parses untrusted CSS."
