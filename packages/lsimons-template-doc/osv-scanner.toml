# osv-scanner config for this package's bun.lock. osv-scanner picks up the
# osv-scanner.toml in the same directory as the lockfile it is scanning,
# so `mise run vuln:osv` (and the CI `vuln` job) applies it with no flag.
#
# Every entry must carry an `ignoreUntil` so it expires and turns the scan
# red again, forcing a fresh look rather than a permanent silent waiver.
